<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage shop · M.H Chocolate Shop</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#97624D">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%232D1B14'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-size='22' fill='%23C9A227' font-family='Georgia'%3EMH%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="login" class="login-screen">
    <form class="login-card" id="login-form">
      <a class="back-link" href="index.html">← Back to shop</a>
      <p class="eyebrow">Shopkeeper</p>
      <h1>M.H Chocolate Shop</h1>
      <p class="lede">Sign in to edit the shelf saved in this browser.</p>
      <label class="field"><span>Username</span><input name="username" autocomplete="username" required></label>
      <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
      <p class="form-error" id="login-error" role="alert"></p>
      <button class="btn full" type="submit">Enter dashboard</button>
    </form>
  </main>

  <div id="app" class="admin-shell" hidden>
    <aside class="sidebar">
      <div class="side-brand"><span class="mark">MH</span> Shop desk</div>
      <nav class="side-nav" aria-label="Dashboard">
        <button type="button" data-panel="dashboard">Dashboard</button>
        <button type="button" data-panel="products">Products</button>
        <button type="button" data-panel="settings">Settings</button>
        <button type="button" data-panel="logout" id="logout">Logout</button>
      </nav>
    </aside>
    <div class="admin-main">
      <section id="panel-dashboard"></section>
      <section id="panel-products" hidden>
        <div class="panel-bar">
          <h2>Products</h2>
          <button class="btn" id="add-product" type="button">Add product</button>
        </div>
        <label class="field"><span>Search</span><input id="product-search" type="search" placeholder="Name or category"></label>
        <div id="product-list"></div>
      </section>
      <section id="panel-settings" hidden>
        <h2>Settings</h2>
        <form id="settings-form">
          <label class="field"><span>Shop name</span><input id="set-name" required></label>
          <div class="split">
            <label class="field"><span>WhatsApp number</span><input id="set-whatsapp" inputmode="numeric" placeholder="91XXXXXXXXXX" required></label>
            <label class="field"><span>Currency</span><input id="set-currency" maxlength="4" required></label>
          </div>
          <p class="note">Use the country code and no plus sign, for example 919876543210. The customer order opens https://wa.me/ that number.</p>
          <p class="form-error" id="settings-error" role="status"></p>
          <button class="btn" type="submit">Save settings</button>
        </form>
        <p style="margin-top:22px"><button class="btn danger" id="restore" type="button">Restore original catalog</button></p>
      </section>
    </div>
  </div>

  <div id="editor" class="modal" hidden>
    <form class="sheet" id="product-form">
      <button class="close" id="editor-close" type="button" aria-label="Close">×</button>
      <h2 id="editor-title">Add product</h2>
      <img class="preview" id="prod-preview" alt="" hidden>
      <label class="field"><span>Product name</span><input id="prod-name" required></label>
      <div class="split">
        <label class="field"><span>Price</span><input id="prod-price" type="number" min="0" step="0.01" required></label>
        <label class="field"><span>Stock</span><input id="prod-stock" type="number" min="0" step="1" required></label>
      </div>
      <label class="field"><span>Category</span><input id="prod-category" list="category-list" required></label>
      <datalist id="category-list"></datalist>
      <label class="field"><span>Image URL</span><input id="prod-image" placeholder="https:// or assets/images/p1.jpg"></label>
      <label class="field"><span>Upload product image</span><input id="prod-file" type="file" accept="image/*"></label>
      <label class="field"><span>Description</span><textarea id="prod-description"></textarea></label>
      <p class="form-error" id="editor-error" role="alert"></p>
      <button class="btn full" type="submit">Save product</button>
      <p><button class="btn danger" id="delete-current" type="button" hidden>Delete product</button></p>
    </form>
  </div>

  <script src="js/cart.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
